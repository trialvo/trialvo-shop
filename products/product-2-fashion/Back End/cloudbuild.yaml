steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:${_IMAGE_TAG}",
        "."
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:${_IMAGE_TAG}"
      ]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:${_IMAGE_TAG}",
        "--region",
        "${_REGION}",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--set-cloudsql-instances",
        "${_INSTANCE_CONNECTION_NAME}",
        "--set-env-vars",
        "^@@^NODE_ENV=${_NODE_ENV}@@BASE_URL=${_BASE_URL}@@DB_USER=${_DB_USER}@@DB_NAME=${_DB_NAME}@@DB_PASSWORD=${_DB_PASSWORD}@@INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME}@@CONNECTION_LIMIT=${_CONNECTION_LIMIT}@@STORAGE_DRIVER=${_STORAGE_DRIVER}@@GCS_BUCKET=${_GCS_BUCKET}@@GCS_PROJECT_ID=${_GCS_PROJECT_ID}@@STORAGE_URL=${_STORAGE_URL}@@GAUTH_CLIENT_ID=${_GAUTH_CLIENT_ID}@@JWTEXPIRY=${_JWTEXPIRY}@@JWTSECRET=${_JWTSECRET}@@UNSUBSCRIBE_SECRET=${_UNSUBSCRIBE_SECRET}@@FRAUDE_API_KEY=${_FRAUDE_API_KEY}@@FRAUDE_API_URL=${_FRAUDE_API_URL}@@GUEST_SSL_EMAIL=${_GUEST_SSL_EMAIL}@@TEST_SSL_PHONE=${_TEST_SSL_PHONE}@@ADMIN_URL=${_ADMIN_URL}@@SHOP_URL=${_SHOP_URL}@@GLOBAL_RATE_LIMIT_MAX=${_GLOBAL_RATE_LIMIT_MAX}@@GLOBAL_RATE_LIMIT_WINDOW_MS=${_GLOBAL_RATE_LIMIT_WINDOW_MS}@@BRAND_ADDRESS=${_BRAND_ADDRESS}@@BRAND_NAME=${_BRAND_NAME}@@ANNOUNCEMENT_HEIGHT=${_ANNOUNCEMENT_HEIGHT}@@ANNOUNCEMENT_QUALITY=${_ANNOUNCEMENT_QUALITY}@@ANNOUNCEMENT_WIDTH=${_ANNOUNCEMENT_WIDTH}@@BANNER_HEIGHT=${_BANNER_HEIGHT}@@BANNER_QUALITY=${_BANNER_QUALITY}@@BANNER_WIDTH=${_BANNER_WIDTH}@@CATEGORY_HEIGHT=${_CATEGORY_HEIGHT}@@CATEGORY_QUALITY=${_CATEGORY_QUALITY}@@CATEGORY_WIDTH=${_CATEGORY_WIDTH}@@PRODUCT_HEIGHT=${_PRODUCT_HEIGHT}@@PRODUCT_QUALITY=${_PRODUCT_QUALITY}@@PRODUCT_WIDTH=${_PRODUCT_WIDTH}@@PROFILE_QUALITY=${_PROFILE_QUALITY}@@PROFILE_SIZE=${_PROFILE_SIZE}@@FACE_IMAGE_WIDTH=${_FACE_IMAGE_WIDTH}@@FACE_IMAGE_HEIGHT=${_FACE_IMAGE_HEIGHT}@@FACE_IMAGE_QUALITY=${_FACE_IMAGE_QUALITY}"
      ]

options:
  logging: CLOUD_LOGGING_ONLY

