name: Build & Deploy PayVault

on:
  push:
    branches:
      - deploy   # Trigger only on 'deploy' branch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/shuvosvc/payment-service

jobs:
  # ─── Stage 1: Build Docker image and push to GHCR ──────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 2: SSH into VPS and deploy ───────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/opc/payvault

            echo "🔑 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📦 Pulling latest image..."
            docker compose -f docker-compose.prod.yml pull app

            echo "🚀 Starting services..."
            # Start DB + Redis if not running (idempotent)
            docker compose -f docker-compose.prod.yml up -d postgres redis

            echo "⏳ Waiting for DB to be healthy..."
            sleep 10

            # Rolling restart of app only (zero downtime)
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate app nginx

            echo "🏥 Health check..."
            sleep 15
            curl -f http://127.0.0.1:8088/health && echo "✅ Health check passed" || (echo "❌ Health check failed"; exit 1)

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "✅ PayVault deployed successfully at $(date)"
