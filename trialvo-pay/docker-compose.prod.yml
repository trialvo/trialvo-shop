# Production cutover compose for pay.trialvo.com
# Uses existing Trialvo Shop Postgres/Redis on network trialvo-shop_shop_internal.
# Keeps DNS alias "trialvo-pay" so shop backend + IPN keep working.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: payvault-app:latest
    container_name: payvault-app
    restart: always
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MASTER_KEY: ${MASTER_KEY}
      BASE_URL: ${BASE_URL:-https://pay.trialvo.com}
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      shop_internal:
        aliases:
          - trialvo-pay
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5

networks:
  shop_internal:
    external: true
    name: trialvo-shop_shop_internal
