<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Expired — Trialvo Pay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0d9488;
    --brand-light: #14b8a6;
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-2: #475569;
    --text-muted: #94a3b8;
    --warning: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(13,148,136,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(20,184,166,0.05) 0%, transparent 50%);
  }
  .container { width: 100%; max-width: 440px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--warning), #fbbf24);
  }
  .icon-wrap {
    width: 72px; height: 72px;
    background: rgba(245, 158, 11, 0.08);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    color: var(--warning);
  }
  h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 12px; letter-spacing: -0.02em; }
  p { font-size: 0.9375rem; color: var(--text-2); line-height: 1.6; margin-bottom: 24px; }
  .footer {
    margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 0.75rem; color: var(--text-muted);
  }
  .footer svg { opacity: 0.6; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <h1>Payment Expired</h1>
    <p>This payment link has expired for security reasons. Please contact the service provider to request a new payment link.</p>
  </div>
  <div class="footer">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Secured by <strong>Trialvo Pay</strong>
  </div>
</div>
</body>
</html>
