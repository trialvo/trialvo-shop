<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirming Payment — Trialvo Pay</title>
<meta http-equiv="refresh" content="5;url={{REDIRECT_URL}}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0d9488;
    --brand-light: #14b8a6;
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-2: #475569;
    --text-muted: #94a3b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .container { width: 100%; max-width: 440px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.05);
  }
  .icon-wrap {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--brand), var(--brand-light));
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    color: white;
  }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
  p { font-size: 0.9375rem; color: var(--text-2); line-height: 1.6; margin-bottom: 28px; }
  .redirect-notice {
    font-size: 0.8125rem; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; background: #f8fafc; border-radius: 12px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.05);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="icon-wrap">
      <div class="spinner" style="width:28px;height:28px;border-width:3px;border-top-color:#fff;"></div>
    </div>
    <h1>Confirming your payment</h1>
    <p>We received your payment callback and are verifying it with the bank. This usually takes a few seconds — your subscription will activate automatically.</p>
    <div class="redirect-notice">
      <div class="spinner"></div>
      Returning you to the merchant...
    </div>
  </div>
</div>
</body>
</html>
