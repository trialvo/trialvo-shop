# Trialvo Lifestyle — Option 2 (client-hosted) trial installer.
#
# Images are pulled from the private registry (no source code is shipped).
# Fill `.env` (copy from `.env.example`), then run ./setup.sh (or setup.ps1).
#
# Image references are interpolated from `.env` (TRIAL_IMAGE_*). Secrets and the
# Control Plane URL come from `agent.env` (generated by Trialvo). The browser
# reaches the API on this host's published port, so PUBLIC_API_ORIGIN must be a
# URL the end-user's browser can open (e.g. https://api.your-domain or, for a
# local test, http://localhost:<API_PORT>).

services:
  # One-shot seed: loads the demo schema + data the first time only (idempotent —
  # skips if the database already has tables). Uses the API image because it
  # bundles both the seed SQL and the MySQL client.
  seed:
    image: ${TRIAL_IMAGE_API:-registry.trialvo.com/lifestyle-api:trial}
    restart: "no"
    env_file:
      - .env
      # agent.env carries TRIAL_ADMIN_EMAIL / TRIAL_ADMIN_PASSWORD so the seeder
      # can upsert the same credentials Trialvo emailed to the customer.
      - agent.env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ecom}
    # Seeder is baked into the API image (scripts/seed-trial.sh) with normalized
    # line endings, so this stays a single, CRLF-safe command line.
    command: ["sh", "/usr/src/app/scripts/seed-trial.sh"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${TRIAL_IMAGE_API:-registry.trialvo.com/lifestyle-api:trial}
    restart: unless-stopped
    env_file:
      - .env
      - agent.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      USE_AGENT_GATE: "1"
      AGENT_GATE_URL: http://license-agent:9099/gate
      TRIAL_MODE: "1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-ecom}
    ports:
      - "${API_PORT:-9000}:5000"
    volumes:
      - uploads_data:/usr/src/app/uploads
      # Public key used to verify the signed license lease.
      - ./license_public.pem:/usr/src/app/config/license_public.pem:ro
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      license-agent:
        condition: service_started

  admin:
    image: ${TRIAL_IMAGE_ADMIN:-registry.trialvo.com/lifestyle-admin:trial}
    restart: unless-stopped
    environment:
      # Runtime API URL injected into /config.js at container start.
      API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:9000}
      IMAGE_URL: ${PUBLIC_API_ORIGIN:-http://localhost:9000}
      API_PREFIX: /api/v1
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      - api

  shop:
    image: ${TRIAL_IMAGE_SHOP:-registry.trialvo.com/lifestyle-shop:trial}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Server-side: the Next server reaches the API over the compose network.
      API_URL: http://api:5000
      # Browser-rendered image URLs must be reachable from the end-user.
      IMAGE_URL: ${PUBLIC_API_ORIGIN:-http://localhost:9000}
      SITE_URL: ${PUBLIC_SHOP_ORIGIN:-http://localhost:5000}
      SHOP_URL: ${PUBLIC_SHOP_ORIGIN:-http://localhost:5000}
      APP_URL: ${PUBLIC_SHOP_ORIGIN:-http://localhost:5000}
    ports:
      - "${SHOP_PORT:-5000}:5000"
    depends_on:
      - api

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ecom}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Independent Go lease-gate watchdog. Fetches the signed lease from the
  # Control Plane and serves it to the API's gate check. It does NOT process
  # remote commands (the in-container Node client owns those).
  license-agent:
    image: ${TRIAL_IMAGE_AGENT:-registry.trialvo.com/lifestyle-license-agent:trial}
    restart: unless-stopped
    env_file:
      - agent.env
    environment:
      AGENT_PORT: "9099"
      LEASE_CACHE_PATH: /agent/lease.jwt
    volumes:
      - agent_data:/agent
    depends_on:
      - db

volumes:
  mysql_data:
  uploads_data:
  agent_data:
