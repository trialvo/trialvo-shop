# INFRA-1 — Traefik reverse proxy for Option 1 trials (*.trial.trialvo.com)
# Usage (on trial host):
#   docker network create traefik_public
#   docker compose -f docker-compose.traefik.yml up -d
#
# Requires INFRA-2: DNS A/AAAA record *.trial.trialvo.com → this host.
# ACME email via LETSENCRYPT_EMAIL env.

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-ops@trialvo.com}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik_public

volumes:
  traefik_letsencrypt:

networks:
  traefik_public:
    external: true
