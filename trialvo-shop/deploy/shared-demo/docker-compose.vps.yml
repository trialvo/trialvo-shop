# VPS-specific overrides (public demo URLs + same-origin shop images).
# Merged with docker-compose.yml on NEW VPS deploy via remote-deploy-demos.sh.
#
# Shops use IMAGE_URL="" so the browser loads /uploads via Next.js rewrites.
# APIs keep STORAGE_URL on the public API port for admin panels.

x-demo-host: &demo_host 217.216.108.119

services:
  lifestyle-api:
    environment:
      STORAGE_URL: http://217.216.108.119:9100
      SHOP_URL: http://217.216.108.119:5100
      ADMIN_URL: http://217.216.108.119:5174

  lifestyle-admin:
    environment:
      API_ORIGIN: http://217.216.108.119:9100
      IMAGE_URL: http://217.216.108.119:9100

  lifestyle-shop:
    environment:
      IMAGE_URL: ""
      SITE_URL: http://217.216.108.119:5100
      SHOP_URL: http://217.216.108.119:5100
      APP_URL: http://217.216.108.119:5100
      ADMIN_URL: http://217.216.108.119:5174

