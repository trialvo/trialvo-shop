# ═══════════════════════════════════════════════════════════
# Trialvo Shop — Local Development Docker Compose
# MySQL lives in ../../infra (shared across products).
# Postgres kept only for Trialvo Pay (trialvo_pay)
#
# Prerequisite:
#   docker compose -f ../infra/docker-compose.yml up -d
#   (from trialvo-shop)  OR from repo root:
#   docker compose -f infra/docker-compose.yml up -d
# ═══════════════════════════════════════════════════════════

services:
  # ─── Postgres — Trialvo Pay only ─────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trialvo
      POSTGRES_PASSWORD: localdev2026
      POSTGRES_DB: trialvo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./init-db-pay.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - shop_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialvo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Redis (for trialvo-pay) ─────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass localdevpassword --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_local:/data
    ports:
      - "6380:6379"
    networks:
      - shop_local
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localdevpassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Node.js Shop API) ──────────────────────────
  backend:
    build:
      context: ./trialvo-backend
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: development
      # Host-published shared MySQL (infra/docker-compose.yml → :3430)
      DB_HOST: host.docker.internal
      DB_PORT: 3430
      DB_USER: trialvo
      DB_PASSWORD: localdev2026
      DB_NAME: trialvo_shop
      CORS_ORIGIN: http://localhost:8091
      JWT_SECRET: local-dev-jwt-secret-trialvo-2026
      JWT_EXPIRES_IN: 7d
      TRIALVO_PAY_BASE_URL: http://trialvo-pay:8080
      TRIALVO_PAY_SERVICE_ID: 28280023-008f-4307-83de-5e4eabb57562
      TRIALVO_PAY_API_KEY: daf90c493bf0c883fc5d766ffd3033a6bce160dfcd8dceee9e6e514e0ac6e9a9
      TRIALVO_PAY_IPN_SECRET: 41215d634fe61aa1693bebbd9e85b935b84a7a4d2be0d4718aca335e3570177b
      FRONTEND_URL: http://localhost:8091
      IPN_URL: http://backend:5000/api/payments/ipn
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shop_local
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Frontend (Vite React static) ───────────────────────
  frontend:
    build:
      context: ./trialvo-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    networks:
      - shop_local

  # ─── Trialvo Pay (Rust payment service) ──────────────────
  trialvo-pay:
    build:
      context: ../trialvo-pay
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trialvo:localdev2026@postgres:5432/trialvo_pay
      REDIS_URL: redis://:localdevpassword@redis:6379
      MASTER_KEY: 45c11faf4c682130ba6610a471e76a5f5bbc4d9028b9d9ef7354d6beae681778
      BASE_URL: http://localhost:8088
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: info
    networks:
      - shop_local
    ports:
      - "8088:8080"
    volumes:
      - ../trialvo-pay/static:/app/static:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ─── Nginx (local reverse proxy) ─────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8091:80"
    volumes:
      - ./nginx-shop.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shop_local

networks:
  shop_local:
    driver: bridge

volumes:
  postgres_data_local:
  redis_data_local:
