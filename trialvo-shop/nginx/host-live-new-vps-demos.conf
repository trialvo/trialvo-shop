# Host nginx on NEW VPS (217.216.108.119) — Option 1 shared demo subdomains
# DNS: A record *-demo.trialvo.com → this host (Cloudflare proxy recommended).
# Cloudflare terminates TLS; origin listens on 80 and honors X-Forwarded-Proto.
#
# Shop / admin / API ports (docker compose shared-demo):
#   lifestyle  :5100 / :5174 / :9100
#   fashion    :5101 / :5175 / :9101
#   techshop   :5102 / :5176 / :9102
#   combo      :5103 / :5177 / :9103

# ─── Lifestyle ───
server {
    listen 80;
    server_name lifestyle-demo.trialvo.com;
    client_max_body_size 25M;
    if ($http_x_forwarded_proto != "https") {
        return 301 https://lifestyle-demo.trialvo.com$request_uri;
    }
    location = /admin { return 302 https://lifestyle-admin-demo.trialvo.com/; }
    location = /admin/ { return 302 https://lifestyle-admin-demo.trialvo.com/; }
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

