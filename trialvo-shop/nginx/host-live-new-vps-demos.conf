    listen 80;
    server_name lifestyle-admin-demo.trialvo.com;
    client_max_body_size 25M;
    if ($http_x_forwarded_proto != "https") {
        return 301 https://lifestyle-admin-demo.trialvo.com$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:5174;
