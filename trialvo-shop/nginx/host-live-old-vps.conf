# Host nginx on OLD VPS (155.248.253.24) — public domains → docker stacks
#   shop.trialvo.com      → trialvo-shop frontend  (127.0.0.1:8090)
#   shop-api.trialvo.com  → trialvo-shop backend   (127.0.0.1:5000)
#   pay.trialvo.com       → trialvo-pay / payvault-app (127.0.0.1:8088)
# Cloudflare proxies TLS; origin listens on 80 and honors X-Forwarded-Proto.

# ─── shop.trialvo.com → trialvo-shop (marketplace UI) ───
server {
    listen 80;
    server_name shop.trialvo.com;

    client_max_body_size 10M;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://shop.trialvo.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

